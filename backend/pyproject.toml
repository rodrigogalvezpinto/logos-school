[project]
name = "logos-backend"
version = "0.1.0"
description = "Backend de Logos - plataforma de preparación para Exámenes Libres (Mineduc, Chile)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "psycopg2-binary>=2.9",
    "alembic>=1.14",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.2",
    "python-multipart>=0.0.12",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "google-auth>=2.35",
    "resend>=2.4",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]
