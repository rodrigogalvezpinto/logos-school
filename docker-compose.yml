version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: logos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: logos_dev
      POSTGRES_PASSWORD: logos_dev_local
      POSTGRES_DB: logos_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logos_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
