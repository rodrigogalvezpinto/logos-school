name: QA auditoría de contenido

on:
  push:
    branches:
      - qa/fase-2-matriz-trazabilidad
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar-evaluaciones-markdown:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar pytest
        run: python -m pip install --upgrade pytest
      - name: Ejecutar pruebas unitarias del validador
        working-directory: backend
        run: python -m pytest -q scripts/tests/test_validar_evaluaciones_markdown.py
      - name: Ejecutar escaneo estructural y guardar hallazgos
        id: escaneo
        working-directory: backend
        shell: bash
        run: |
          set +e
          python scripts/validar_evaluaciones_markdown.py > ../informe-hallazgos-estructurales.txt 2>&1
          scan_status=$?
          set -e
          cat ../informe-hallazgos-estructurales.txt
          echo "scan_status=$scan_status" >> "$GITHUB_OUTPUT"
          {
            echo "## Escaneo estructural de contenido"
            echo
            if [ "$scan_status" -eq 0 ]; then
              echo "El escaneo no detectó discrepancias según las reglas implementadas."
            else
              echo "El escaneo detectó hallazgos o errores de análisis. Consulta el artefacto `informe-hallazgos-estructurales`."
            fi
            echo
            echo "**Importante:** este escaneo es estructural y no certifica exactitud pedagógica, curricular ni funcionamiento en la aplicación."
            echo "Los hallazgos no se ocultan: se conservan en el informe adjunto. Las pruebas unitarias del validador sí bloquean el flujo si fallan."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publicar informe de hallazgos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-hallazgos-estructurales
          path: informe-hallazgos-estructurales.txt
          if-no-files-found: warn
          retention-days: 30
