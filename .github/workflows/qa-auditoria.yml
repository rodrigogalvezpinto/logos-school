# QA Auditoría Automatizada — Logos School
# Se ejecuta en cada push a main y en cada PR
# Requiere: secrets configurados (ver abajo)

name: QA Auditoría Completa

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}  # Permite ejecución manual

env:
  # Configuración de base de datos de test (Neon branch efímera)
  DATABASE_URL_TEST: ${{ secrets.DATABASE_URL_TEST }}
  # Configuración para validadores de contenido
  CONTENIDO_PATH: ./contenido
  BACKEND_PATH: ./backend
  FRONTEND_PATH: ./frontend

jobs:
  # ============================================================
  # 1. VALIDACIÓN DE CONTENIDO (rápida, sin BD)
  # ============================================================
  validar-contenido:
    name: 📚 Validar contenido (claves, anglicismos, hechos, formato)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necesario para git diff en validadores

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd backend
          pip install -e ".[dev]" --quiet

      - name: 🔑 Validar distribución de claves (≤45% por letra)
        run: |
          cd backend
          python scripts/validador_claves.py contenido --fix || true
          # El || true permite que falle sin parar el workflow; revisamos artefactos

      - name: 🌐 Validar anglicismos
        run: |
          cd backend
          python scripts/validador_anglicismos.py contenido --fix || true

      - name: 🔬 Validar precisión factual (mitos conocidos)
        run: |
          cd backend
          python scripts/validador_factual.py contenido --fix || true

      - name: 📋 Validar formato de pautas (estandarización)
        run: |
          cd backend
          python scripts/validador_formato_pauta.py contenido --fix || true

      - name: Commit automático de correcciones (si hay cambios)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add -A
            git commit -m "chore: auto-fix contenido (claves/anglicismos/hechos/pautas) [skip ci]"
            git push
          else
            echo "No hay cambios que commitear"
          fi

      - name: Subir reporte de validación como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: reporte-validacion-contenido
          path: |
            backend/validador_*.log
            *.log
          retention-days: 7

  # ============================================================
  # 2. BACKEND TESTS (requiere BD)
  # ============================================================
  backend-tests:
    name: 🐍 Backend tests (pytest + matriz permisos)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: logos_test
          POSTGRES_PASSWORD: logos_test
          POSTGRES_DB: logos_test
        ports: [5432:5432]
        options: >-
          --health-cmd="pg_isready -U logos_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -e ".[dev]" --quiet

      - name: Run migrations
        run: |
          cd backend
          DATABASE_URL=postgresql://logos_test:logos_test@localhost:5432/logos_test alembic upgrade head

      - name: Run pytest (matriz permisos + suite completa)
        run: |
          cd backend
          DATABASE_URL=postgresql://logos_test:logos_test@localhost:5432/logos_test \
          PYTHONPATH=. \
          pytest -q --tb=short --cov=app --cov-fail-under=80

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/htmlcov/
          retention-days: 7

  # ============================================================
  # 3. FRONTEND TESTS (build + lint + E2E)
  # ============================================================
  frontend-tests:
    name: 🌐 Frontend tests (build + lint + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint (ESLint)
        run: |
          cd frontend
          npm run lint

      - name: Format check (Prettier)
        run: |
          cd frontend
          npm run format:check

      - name: Build production
        run: |
          cd frontend
          npm run build -- --configuration production

      - name: Start backend for E2E (con BD test)
        run: |
          cd backend
          pip install -e ".[dev]" --quiet
          DATABASE_URL=postgresql://logos_test:logos_test@localhost:5432/logos_test alembic upgrade head &
          sleep 5
          DATABASE_URL=postgresql://logos_test:logos_test@localhost:5432/logos_test \
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 3

      - name: Run Playwright E2E
        run: |
          cd frontend
          npx playwright install --with-deps chromium
          npx playwright test --workers=2
        env:
          BASE_URL: http://localhost:4200
          API_URL: http://localhost:8000

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload Playwright traces (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7

  # ============================================================
  # 4. VALIDACIÓN CRUZADA CONTENIDO ↔ CÓDIGO
  # ============================================================
  validacion-cruzada:
    name: 🔗 Validación cruzada contenido ↔ código
    runs-on: ubuntu-latest
    needs: [validar-contenido, backend-tests]
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd backend
          pip install -e ".[dev]" --quiet

      - name: Verificar que todos los OA citados en pautas existen en Temarios/analisis
        run: |
          cd backend
          python -c "
          import re
          from pathlib import Path
          
          # Extraer OA de pautas
          oa_en_pautas = set()
          for archivo in Path('../contenido').rglob('*-forma-b.md'):
              contenido = archivo.read_text()
              # Buscar patrón 'OA N°X' o 'OA X'
              matches = re.findall(r'OA\s+N?[°º]?\s*(\d+)', contenido, re.IGNORECASE)
              oa_en_pautas.update(matches)
          
          # Extraer OA de temarios
          oa_en_temarios = set()
          for archivo in Path('../Temarios/analisis').glob('*.md'):
              contenido = archivo.read_text()
              matches = re.findall(r'OA\s+N?[°º]?\s*(\d+)', contenido, re.IGNORECASE)
              oa_en_temarios.update(matches)
          
          # Verificar
          faltantes = oa_en_pautas - oa_en_temarios
          if faltantes:
              print(f'❌ OA en pautas pero NO en temarios: {sorted(faltantes)}')
              exit(1)
          else:
              print(f'✅ Todos los OA de pautas ({len(oa_en_pautas)}) existen en temarios ({len(oa_en_temarios)})')
          "

      - name: Verificar imports de contenido en código (no hardcodear preguntas)
        run: |
          cd backend
          python -c "
          import re
          from pathlib import Path
          
          # Buscar enrutadores que importen contenido directamente
          problemas = []
          for archivo in Path('app').rglob('*.py'):
              contenido = archivo.read_text()
              # Detectar import de archivos .md de contenido
              if 'contenido/' in contenido and '.md' in contenido:
                  problemas.append(f'{archivo}: importa contenido .md directamente')
              # Detectar SQL con preguntas hardcodeadas
              if re.search(r'INSERT.*preguntas|VALUES.*[\"\\'].*\?', contenido, re.IGNORECASE):
                  problemas.append(f'{archivo}: posible hardcodeo de preguntas en SQL')
          
          if problemas:
              for p in problemas:
                  print(f'⚠️  {p}')
              exit(1)
          else:
              print('✅ No se detectaron imports directos de contenido ni hardcodeo de preguntas')
          "

  # ============================================================
  # 5. RESUMEN FINAL Y GATE DE PUBLICACIÓN
  # ============================================================
  gate-publicacion:
    name: 🚦 Gate de publicación (requiere todos los checks verdes)
    runs-on: ubuntu-latest
    needs: [validar-contenido, backend-tests, frontend-tests, validacion-cruzada]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Verificar estado de jobs requeridos
        run: |
          echo "✅ Todos los checks previos pasaron"
          echo "📋 Resumen de validación:"
          echo "   - Contenido: claves ≤45%, sin anglicismos, hechos verificados, pautas estandarizadas"
          echo "   - Backend: 326/326 tests + matriz permisos + coverage ≥80%"
          echo "   - Frontend: build + lint + format + 69/69 Playwright E2E"
          echo "   - Cruzada: OA en pautas ↔ temarios, sin hardcodeo"
          echo ""
          echo "🚀 LISTO PARA DEPLOY (manual a staging/producción)"
          echo "   Próximos pasos manuales:"
          echo "   1. Deploy a Neon dev branch + Render preview"
          echo "   2. Configurar secrets reales (Google, Resend, Pagos, Turnstile)"
          echo "   3. Smoke test en staging"
          echo "   4. Deploy a producción (Neon main + Render prod + Cloudflare Pages)"

      - name: Notificar (opcional - Slack/Discord/Email)
        if: false  # Cambiar a true y configurar secrets para activar
        run: |
          echo "Notificación enviada"

# ============================================================
# SECRETS REQUERIDOS (configurar en GitHub Settings > Secrets)
# ============================================================
# DATABASE_URL_TEST          - postgresql://user:pass@host:5432/logos_test (Neon branch efímera)
# GOOGLE_CLIENT_ID           - Para tests de auth Google
# GOOGLE_CLIENT_SECRET       - Para tests de auth Google
# RESEND_API_KEY             - Para tests de envío email
# JWT_SECRET_TEST            - Secret para tests (distinto de prod)
# TURNSTILE_SECRET_KEY       - Para tests anti-bot
# PAGOS_WEBPAY_API_KEY       - Para tests de pagos (cuando exista)
# SLACK_WEBHOOK_URL          - Opcional: notificaciones a Slack
# DISCORD_WEBHOOK_URL        - Opcional: notificaciones a Discord